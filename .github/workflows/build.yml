name: Windows build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate language catalogs and placeholders
        shell: pwsh
        run: ./scripts/test-localization.ps1
      - name: Build self-contained Windows application
        shell: pwsh
        run: ./scripts/build.ps1 -Publish -SelfContained
      - name: Package and validate binaries, notices and checksums
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/test-package.ps1
